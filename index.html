<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Climate Change Project</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">Coral Reefs</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="climateWrapper">
        <div class="card">
            <div class="cardInner">
                <h1>Test</h1>
            </div>
        </div>
        <div class="card">
            <div class="cardInner warmingWrapper">
                <img src="src/thermometer.svg" alt="Small thermometer showing a hot temperature" height="80">
                <h2>Warming Ocean</h2>
            </div>
            <p>Test!</p>
        </div>
        <div class="card">
            <div class="cardInner seaLevelWrapper">
                <h2>Sea Level Rise</h2>
                <img src="src/seaLevel.png" alt="Icon of water with an arrow above pointing upwards to indicate a rising level" height="80">
            </div>
            <p>Test!</p>
        </div>
        <div class="card">
            <div class="cardInner stormWrapper">
                <img src="src/storm.svg" alt="Storm cloud with lightning bolt coming out the bottom" height="80">
                <h2>Changes in Storm Patterns</h2>
            </div>
            <p>Test!</p>
        </div>
        <div class="card">
            <div class="cardInner precipitationWrapper">
                <h2>Changes in Precipitation</h2>
                <img src="src/precipitation.svg" alt="Rain cloud with drops falling" height="80">

            </div>
            <p>Test!</p>
        </div>
        <div class="card">
            <div class="cardInner currentWrapper">
                <img src="src/currents.svg" alt="Ocean currents moving left and right" height="70">
                <h2>Altered Ocean Currents</h2>
            </div>
            <p>Test!</p>
        </div>
        <div class="card">
            <div class="cardInner acidWrapper">
                <h2>Ocean Acidification</h2>
                <img src="src/acid.svg" alt="Acid Flask with a black outline" height="70">
            </div>
            <p>Test!</p>
        </div>
    </div>
    <footer>
        <div class="footer-links">
            <img src="src/coral1.svg" alt="Image of orange corals">
            <a href="#contactUs">Contact Us</a>
            <a href="#moreInfo">More Information</a>
            <a href="#socials">Socials</a>
            <img src="src/coral2.svg" alt="Image of pink corals">
        </div>
    </footer>
</body>

</html>
